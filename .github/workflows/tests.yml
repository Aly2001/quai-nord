# ======================================================================
#  Vérifications automatiques de Quai Nord (GitHub Actions)
#
#  À chaque « git push », GitHub lance ces étapes sur ses propres machines :
#    1. les tests du site (Vitest) ;
#    2. la construction du site (détecte un fichier manquant, une erreur de syntaxe...) ;
#    3. une vérification que tous les scripts Python sont lisibles par Python ;
#    4. les tests du serveur de Nora ;
#    5. les tests de la préparation des bus (charger_bus.py, sur un faux réseau).
#  Résultat : une coche verte ✅ ou une croix rouge ❌ à côté de chaque envoi.
# ======================================================================
name: Tests

on:
  push:
  pull_request:

jobs:
  site:
    name: Site (tests et construction)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les librairies du site
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Construire le site
        run: npm run build

  python:
    name: Scripts Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier que chaque script est un code Python valide
        run: python -m py_compile *.py

      - name: Installer les librairies de Nora
        run: pip install -r nora/requirements.txt pytest

      - name: Lancer les tests de Nora (Mistral simulé, aucune clé nécessaire)
        run: python -m pytest nora -q

      - name: Lancer les tests des bus et du modèle (fausses données, aucun téléchargement)
        run: |
          pip install requests pandas scikit-learn joblib
          python -m pytest tests -q
